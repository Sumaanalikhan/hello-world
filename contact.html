<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        /* Modern Reset and Variables */
        * {
            box-sizing: border-box; /* */
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Card */
        .contact-container {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
        }

        .contact-container h2 {
            color: #333333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }

        .contact-container p {
            color: #666666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Form Layout */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444444;
            font-size: 14px;
            font-weight: 500;
        }

        /* Inputs, Select, and Textarea Styling */
        .form-control {
            width: 100%; /* */
            padding: 12px 16px; /* */
            border: 1px solid #cccccc; /* */
            border-radius: 6px; /* */
            font-size: 15px;
            color: #333333;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: #04AA6D; /* Highlight color on focus */
            box-shadow: 0 0 0 3px rgba(4, 170, 109, 0.15);
        }

        textarea.form-control {
            resize: vertical; /* */
            min-height: 120px;
        }

        /* Submit Button Styling */
        .btn-submit {
            width: 100%;
            background-color: #04AA6D; /* */
            color: #ffffff; /* */
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer; /* */
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #038c5a; /* Smooth hover transition */
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .contact-container {
                padding: 25px 20px;
            }
            .contact-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h2>Get in Touch</h2>
        <p>Feel free to drop us a line. We typically respond within 24 hours.</p>
        
        <!-- Replace YOUR_FORM_ID with your actual Formspree ID to make it work -->
        <form action="https://formspree.io" method="POST">
            
            <!-- Full Name Field -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <!-- Subject Selection Field -->
            <div class="form-group">
                <label for="subject-type">Reason for Contact</label>
                <select id="subject-type" name="reason" class="form-control">
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="billing">Billing Question</option>
                </select>
            </div>

            <!-- Message Field -->
            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" class="form-control" placeholder="How can we help you?" required></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Send Message</button>
            
        </form>
    </div>

</body>
