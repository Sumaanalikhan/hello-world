<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Hello World</title>
    <style>
        /* Center the div on the screen */
        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        #message {
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="center-container">
        <div id="message"></div>
    </div>

    <script>
        // Insert Hello World text into the centered div
        document.getElementById("message").innerText = "Hello World!";
    </script>

</body>
</html>
